<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Let's Talk — Jean Damas</title>
<meta name="description" content="Reach out! I'm always glad to talk content, strategy, or a potential fit." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Karla:wght@400;500;600;700&family=Pacifico&family=Schibsted+Grotesk:wght@700;800&display=swap" rel="stylesheet" />

<style>
  :root {
    --cream:  #FEF5EA;
    --amber:  #FFB567;
    --coral:  #FF6A5C;
    --teal:   #056571;
    --ink:    #0A0A0A;
    --paper:  #FFFFFF;

    --radius: 20px;
    --gap: 24px;
    --pad: clamp(20px, 3.1vw, 56px);
  }

  * { box-sizing: border-box; -webkit-font-smoothing: inherit; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
  }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  @supports (corner-shape: superellipse(2)) {
    .card { corner-shape: superellipse(2); }
  }

  a { color: inherit; }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: 1760px;
    margin: 0 auto;
    padding: var(--gap) var(--gap) 0;
    font-size: 0.95rem;
    font-weight: 500;
    text-decoration: none;
    color: rgba(10, 10, 10, 0.7);
    transition: color 0.25s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .back-link:hover,
  .back-link:focus-visible {
    color: var(--ink);
    transform: translateX(-3px);
  }
  .back-link:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 4px;
    border-radius: 4px;
  }

  .page {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: var(--gap);
  }

  .talk-wrap {
    width: 100%;
    max-width: 720px;
  }

  .card {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    padding: var(--pad);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
  }

  /* --- Single card: headline + copy + form, all centered --- */
  .talk-card {
    background: var(--amber);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .talk-card h1 {
    margin: 0;
    font-family: 'Pacifico', cursive;
    font-weight: 400;
    font-size: clamp(2.5rem, 6vw, 4rem);
    line-height: 1;
    letter-spacing: normal;
  }
  .talk-card > p {
    margin: 20px 0 0;
    max-width: 42ch;
    font-family: 'Karla', sans-serif;
    font-weight: 400;
    font-size: clamp(1.05rem, 1.6vw, 1.25rem);
    line-height: 1.6;
    color: rgba(10, 10, 10, 0.8);
  }

  /* --- Contact form --- */
  .talk-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 100%;
    max-width: 460px;
    margin: 36px auto 0;
    text-align: left;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .field label {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    color: rgba(10, 10, 10, 0.7);
  }
  .field input,
  .field textarea {
    width: 100%;
    padding: 12px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    color: var(--ink);
    background: var(--paper);
    border: 1.5px solid rgba(10, 10, 10, 0.15);
    border-radius: 10px;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .field textarea {
    resize: vertical;
    min-height: 140px;
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
  }
  .field input:focus-visible,
  .field textarea:focus-visible {
    outline: none;
    border-color: var(--amber);
    box-shadow: 0 0 0 3px rgba(255, 181, 103, 0.35);
  }
  .talk-submit {
    position: relative;
    align-self: center;
    margin-top: 8px;
    display: inline-flex;
    align-items: center;
    height: 52px;
    padding: 4px 56px 4px 24px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--paper);
    background: #327471;
    border: none;
    border-radius: 9999px;
    cursor: pointer;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(10, 10, 10, 0.08), 0 8px 18px -8px rgba(50, 116, 113, 0.5);
    transition: padding 0.5s cubic-bezier(0.65, 0, 0.35, 1),
                background-color 0.25s ease,
                box-shadow 0.25s ease;
  }
  .talk-submit:hover,
  .talk-submit:focus-visible {
    padding: 4px 24px 4px 56px;
    background: #295D5A;
    box-shadow: 0 4px 8px -2px rgba(10, 10, 10, 0.15), 0 14px 24px -10px rgba(50, 116, 113, 0.55);
  }
  .talk-submit:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }
  .talk-submit-label {
    position: relative;
    z-index: 1;
  }
  .talk-submit-icon {
    position: absolute;
    top: 50%;
    right: 4px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translateY(-50%);
    transition: right 0.5s cubic-bezier(0.65, 0, 0.35, 1),
                transform 0.5s cubic-bezier(0.65, 0, 0.35, 1);
  }
  .talk-submit:hover .talk-submit-icon,
  .talk-submit:focus-visible .talk-submit-icon {
    right: calc(100% - 44px);
    transform: translateY(-50%) rotate(45deg);
  }
  @media (prefers-reduced-motion: reduce) {
    .talk-submit, .talk-submit-icon { transition: none; }
  }

  /* --- Avatar with LinkedIn badge --- */
  .talk-linkedin {
    position: relative;
    display: inline-block;
    width: 64px;
    height: 64px;
    margin-top: 20px;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .talk-linkedin:hover,
  .talk-linkedin:focus-visible {
    transform: scale(1.08);
  }
  .talk-linkedin:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 4px;
    border-radius: 50%;
  }
  .talk-avatar-photo {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(10, 10, 10, 0.18);
  }
  .talk-avatar-badge {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2.5px solid var(--amber);
    background: var(--paper);
  }
  @media (prefers-reduced-motion: reduce) {
    .talk-linkedin { transition: none; }
  }

  /* --- Responsive --- */
  @media (max-width: 860px) {
    :root { --gap: 14px; --radius: 16px; }
    .page { padding: 14px; }
    .back-link { padding: 14px 14px 0; }
    .floating-menu { top: 14px; right: 14px; }
  }

  /* --- Floating morph menu --- */
  .floating-menu {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 200;
    width: 150px;
    height: 48px;
    display: flex;
    flex-direction: column;
    border-radius: 72px;
    background: rgba(255, 181, 103, 0.8);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(219, 151, 72, 0.7);
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(10, 10, 10, 0.08), 0 10px 24px -12px rgba(10, 10, 10, 0.3);
    transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1),
                height 0.15s cubic-bezier(0.22, 1, 0.36, 1),
                border-radius 0.8s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.3s ease,
                transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .floating-menu:hover {
    transform: scale(1.05);
  }
  .floating-menu.is-open {
    width: 280px;
    height: 260px;
    border-radius: 32px;
    border: none;
    cursor: default;
    transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1),
                height 0.8s cubic-bezier(0.22, 1, 0.36, 1),
                border-radius 0.8s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 0.3s ease,
                box-shadow 0.3s ease;
  }
  .floating-menu.is-open:hover {
    transform: none;
  }

  .floating-menu-circle {
    position: absolute;
    left: 50%;
    bottom: -200%;
    width: 200%;
    height: 200%;
    border-radius: 50%;
    background: rgba(5, 101, 113, 0.82);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transform: translateX(-50%);
    transition: bottom 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .floating-menu.is-open .floating-menu-circle {
    bottom: -20%;
    transition-delay: 0.1s;
  }

  .floating-menu-links {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    flex: 0;
    min-height: 0;
    overflow: hidden;
    padding: 0 20px;
  }
  .floating-menu.is-open .floating-menu-links {
    flex: 1;
  }

  .floating-menu-link {
    position: relative;
    display: flex;
    color: var(--cream);
    font-family: 'Schibsted Grotesk', sans-serif;
    font-weight: 700;
    font-size: 1.3rem;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    line-height: 1;
    text-decoration: none;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .floating-menu.is-open .floating-menu-link {
    opacity: 1;
    transform: translateY(0);
  }
  .floating-menu.is-open .floating-menu-link:nth-child(1) { transition-delay: 0.4s; }
  .floating-menu.is-open .floating-menu-link:nth-child(2) { transition-delay: 0.48s; }
  .floating-menu.is-open .floating-menu-link:nth-child(3) { transition-delay: 0.56s; }
  .floating-menu.is-open .floating-menu-link:nth-child(4) { transition-delay: 0.64s; }
  .floating-menu-link:focus-visible {
    outline: 2px solid var(--cream);
    outline-offset: 4px;
    border-radius: 2px;
  }

  /* Per-character hover flip, built by JS into nested spans */
  .fm-char {
    display: inline-block;
    overflow: hidden;
    height: 1em;
  }
  .fm-char-inner {
    display: flex;
    flex-direction: column;
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .floating-menu-link:hover .fm-char-inner {
    transform: translateY(-50%);
  }
  .fm-char-line {
    display: block;
    height: 1em;
    line-height: 1em;
  }

  .floating-menu-bar {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: 48px;
    flex-shrink: 0;
    padding: 0 20px;
    background: none;
    border: none;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: padding-bottom 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .floating-menu.is-open .floating-menu-bar {
    padding-bottom: 20px;
  }
  .floating-menu-label {
    font-family: 'Pacifico', cursive;
    font-size: 1.35rem;
    font-weight: 400;
    color: var(--ink);
    transition: color 0.3s ease;
  }
  .floating-menu.is-open .floating-menu-label {
    color: var(--cream);
  }

  .floating-menu-burger {
    position: relative;
    width: 18px;
    height: 14px;
    flex-shrink: 0;
  }
  .floating-menu-burger span {
    position: absolute;
    left: 0;
    width: 18px;
    height: 2px;
    border-radius: 999px;
    background: var(--ink);
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                top 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                background-color 0.3s ease;
  }
  .floating-menu-burger span:nth-child(1) { top: 3px; }
  .floating-menu-burger span:nth-child(2) { top: 9px; }
  .floating-menu.is-open .floating-menu-burger span {
    background: var(--cream);
  }
  .floating-menu.is-open .floating-menu-burger span:nth-child(1) {
    top: 6px;
    transform: rotate(45deg);
  }
  .floating-menu.is-open .floating-menu-burger span:nth-child(2) {
    top: 6px;
    transform: rotate(-45deg);
  }

  @media (prefers-reduced-motion: reduce) {
    .floating-menu,
    .floating-menu.is-open,
    .floating-menu-circle,
    .floating-menu-link,
    .floating-menu-bar,
    .floating-menu-burger span,
    .fm-char-inner {
      transition: none;
    }
  }
</style>
</head>
<body>
  <div class="floating-menu" id="floatingMenu">
    <span class="floating-menu-circle" aria-hidden="true"></span>
    <nav class="floating-menu-links" id="floatingMenuLinks" aria-label="Site">
      <a class="floating-menu-link" href="about.html" tabindex="-1">About</a>
      <a class="floating-menu-link" href="portfolio.html" tabindex="-1">Portfolio</a>
      <a class="floating-menu-link" href="services.html" tabindex="-1">Services</a>
      <a class="floating-menu-link" href="lets-talk.html" tabindex="-1" aria-current="page">Let's Talk</a>
    </nav>
    <button class="floating-menu-bar" id="floatingMenuToggle" type="button" aria-expanded="false" aria-controls="floatingMenuLinks">
      <span class="floating-menu-label">Menu</span>
      <span class="floating-menu-burger" aria-hidden="true"><span></span><span></span></span>
    </button>
  </div>

  <a class="back-link" href="index.html">&larr; Back to home</a>
  <main class="page">
    <div class="talk-wrap">

      <section class="card talk-card">
        <h1>Let's Talk</h1>
        <p>Reach out! I'm always glad to talk content, strategy, or a potential fit.</p>
        <a class="talk-linkedin" href="https://www.linkedin.com/in/missjeanlee/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile">
          <img class="talk-avatar-photo" src="brand_assets/Jean%20Damas%20headshot.jpeg" alt="Jean Damas" />
          <img class="talk-avatar-badge" src="brand_assets/linkedin-app-icon.jpeg" alt="" aria-hidden="true" />
        </a>

        <!--
          TODO: replace this form's action with your form service endpoint
          (e.g. Formspree: https://formspree.io/f/your-id, or a Netlify Forms
          setup) once it's ready. Currently a placeholder that goes nowhere.
        -->
        <form class="talk-form" action="#" method="POST">
          <div class="field">
            <label for="first-name">First Name</label>
            <input type="text" id="first-name" name="first_name" autocomplete="given-name" required />
          </div>
          <div class="field">
            <label for="last-name">Last Name</label>
            <input type="text" id="last-name" name="last_name" autocomplete="family-name" required />
          </div>
          <div class="field">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <button class="talk-submit" type="submit">
            <span class="talk-submit-label">Let's collaborate</span>
            <span class="talk-submit-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M7 17L17 7M7 7h10v10"/></svg>
            </span>
          </button>
        </form>
      </section>

    </div>
  </main>
  <script>
    (function () {
      // Split each nav link's text into per-character spans so hover can
      // flip each letter up (like a rolodex), staggered left to right.
      document.querySelectorAll('.floating-menu-link').forEach(function (link) {
        var text = link.textContent;
        link.setAttribute('aria-label', text);
        link.textContent = '';
        text.split('').forEach(function (ch, i) {
          var outer = document.createElement('span');
          outer.className = 'fm-char';
          var inner = document.createElement('span');
          inner.className = 'fm-char-inner';
          inner.style.transitionDelay = (30 * i) + 'ms';
          var line1 = document.createElement('span');
          line1.className = 'fm-char-line';
          line1.textContent = ch === ' ' ? ' ' : ch;
          var line2 = line1.cloneNode(true);
          line2.setAttribute('aria-hidden', 'true');
          inner.appendChild(line1);
          inner.appendChild(line2);
          outer.appendChild(inner);
          link.appendChild(outer);
        });
      });
    })();
  </script>

  <script>
    (function () {
      var menu = document.getElementById('floatingMenu');
      var toggle = document.getElementById('floatingMenuToggle');
      var links = document.querySelectorAll('.floating-menu-link');
      if (!menu || !toggle) return;

      function setOpen(open) {
        menu.classList.toggle('is-open', open);
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        links.forEach(function (l) { l.tabIndex = open ? 0 : -1; });
      }

      toggle.addEventListener('click', function (e) {
        e.stopPropagation();
        setOpen(!menu.classList.contains('is-open'));
      });

      // Clicking anywhere else on the pill opens it (mirrors the source component).
      menu.addEventListener('click', function () {
        if (!menu.classList.contains('is-open')) setOpen(true);
      });

      document.addEventListener('click', function (e) {
        if (menu.classList.contains('is-open') && !menu.contains(e.target)) {
          setOpen(false);
        }
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && menu.classList.contains('is-open')) {
          setOpen(false);
          toggle.focus();
        }
      });
    })();
  </script>
</body>
</html>
